[workspace]
name = "bm_ppi"
description = "Proteome-wide protein-protein interaction prediction in Bombyx mori"
version = "0.1.0"
channels = ['conda-forge', "bioconda"]
platforms = ['linux-64']

[dependencies]
python = "~=3.10.0"
loguru = "*"
ruff = "*"
tqdm = "*"
typer = "*"
pip = "*"
ipykernel = ">=7.1.0,<8"
mmseqs2 = ">=18.8cc5c,<19"
hmmer = ">=3.4,<4"
aria2 = ">=1.37.0,<2"
pyreadr = ">=0.5.4,<0.6"
joblib = ">=1.5.3,<2"
cd-hit = ">=4.8.1,<5"
seqkit = ">=2.13.0,<3"

[pypi-dependencies]
mkdocs = "*"
python-dotenv = "*"
bm_ppi = { path = ".", editable = true }
colabfold = { git = "https://github.com/sokrypton/ColabFold" }
biopython = "<1.86"
polars = ">=1.0.0"
numpy = ">=2.0.2,<3.0.0"

[feature.deeploc]
dependencies = { python = "3.10.*", pip = "*" }

[feature.deeploc.pypi-dependencies]
numpy = "==1.26.4"
torch = "==2.1.2"
transformers = "==4.35.2"
fair-esm = "*"
pytorch-lightning = "==2.6.6"
onnxruntime = "==1.23.2"
biopython = "==1.85"
sentencepiece = "*"
scipy = "*"
pandas = "*"
matplotlib = "*"
httpx = { version = "*", extras = ["socks"] }
socksio = "*"

[environments]
default = ["default"]
deeploc = { features = ["deeploc"], no-default-feature = true }
